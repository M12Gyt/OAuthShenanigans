    <div class="flex items-cente<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OAuth Testing by M12</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Google Sans', Arial, sans-serif; 
               background: #f8f9fa; 
            }
       nav {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(255, 255, 255, 0.82);
        border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        height: 48px;
        width: 100%; 
        }

        .gsthin {
        font-family: 'Google Sans', sans-serif;
        font-weight: 200;
          }

        .gsmedtitle {
        font-family: 'Google Sans', sans-serif;
        font-weight: 450;
        font-size: clamp(28px, 8vw, 50px);
        line-height: 1.3;
        }

        .hero { 
         background: rgba(255, 255, 255,0.78);
         min-height: 92vh;
         display: flex;
         flex-direction: column;
         align-items: center;
         justify-content: center;
         text-align: center;
         padding: 20px 24px 0;
         width: 100%;
        }
        .midstuff { 
         background: rgba(255, 255, 255,0.78);
         min-height: 20vh;
         display: flex;
         flex-direction: column;
         align-items: center;
         justify-content: center;
         text-align: center;
         padding: 20px 24px 0;
        }
       .footer { 
         background: rgba(255, 255, 255,0.68);
         min-height: 5vh;
         display: flex;
         flex-direction: column;
         align-items: flex-start;
         justify-content: flex-start;
         text-align: left;
         padding: 32px 24px;
         border-top: 2px solid rgba(0, 0, 0, 0.06);
        }
        .footer-links {
          display: flex;
          flex-wrap: wrap;
          gap: 10px 20px;
          margin-top: 10px;
        }
        .footer-links a,
        .footer a {
          font-size: 18px;
          color: #202124;
          text-decoration: none;
          padding: 4px 0;
        }
        .bluebutton {
          background: #1a73e8;
          color: white;
          padding: 7px 28px;
          border-radius: 50px;
          font-size: 15px;
          text-decoration: none;
          font-weight: 300;
          margin-bottom: 40px;
          display: inline-block;
        }
        .text-link-highlight {
          text-decoration: none;
          color: inherit;
          padding: 2px 6px;
          margin: -2px -6px;
          border-radius: 4px;
          transition: background 0.15s ease, color 0.15s ease;
        }
        .text-link-highlight:hover {
          background: rgba(26, 115, 232, 0.1);
          color: #1a73e8;
        }

        /* Hamburger menu styles */
        .nav-links {
          display: flex;
          gap: 24px;
          list-style: none;
        }
        .nav-links a {
          text-decoration: none;
          color: #202124;
          font-family: 'Google Sans', sans-serif;
          font-weight: 400;
          font-size: 15px;
        }
        .hamburger {
          display: none;
          flex-direction: column;
          justify-content: space-between;
          width: 24px;
          height: 18px;
          background: none;
          border: none;
          cursor: pointer;
          padding: 0;
          z-index: 200;
        }
        .hamburger span {
          display: block;
          height: 2px;
          width: 100%;
          background: #202124;
          border-radius: 2px;
          transition: transform 0.25s ease, opacity 0.25s ease;
        }
        .hamburger.active span:nth-child(1) {
          transform: translateY(8px) rotate(45deg);
        }
        .hamburger.active span:nth-child(2) {
          opacity: 0;
        }
        .hamburger.active span:nth-child(3) {
          transform: translateY(-8px) rotate(-45deg);
        }

        @media (max-width: 640px) {
          .hamburger {
            display: flex;
          }
          .nav-links {
            position: absolute;
            top: 48px;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.97);
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            flex-direction: column;
            align-items: center;
            gap: 0;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.25s ease;
          }
          .nav-links.open {
            max-height: 300px;
          }
          .nav-links li {
            width: 100%;
            text-align: center;
          }
          .nav-links a {
            display: block;
            padding: 14px 0;
          }
        }
    </style>
</head>
<body>
    <section class="hero" >
        <h1 class="gsmedtitle">Congrats! You are a skinwalker now!</h1>
        <a style="font-size: 23px;" href="/">Sign Out</a>
        <br>
    </section>
</section>
<footer class="footer">
    <a style="font-size: 25px; font-weight: 450;">OAuth Testing by M12</a>
</footer>

<script>
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const navLinks = document.getElementById('navLinks');

    hamburgerBtn.addEventListener('click', () => {
        const isOpen = navLinks.classList.toggle('open');
        hamburgerBtn.classList.toggle('active');
        hamburgerBtn.setAttribute('aria-expanded', isOpen);
    });
</script>
</html>
